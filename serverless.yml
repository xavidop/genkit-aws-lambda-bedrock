service: genkit-aws-lambda-bedrock

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 512
  timeout: 50
  environment:
    NODE_OPTIONS: --enable-source-maps
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
          Resource: 
            - 'arn:aws:bedrock:*::foundation-model/*'
            - 'arn:aws:bedrock:*:*:inference-profile/*'
  logRetentionInDays: 7

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude:
      - '@aws-sdk/*'
    target: node20
    platform: node

plugins:
  - serverless-offline

functions:
  storyGenerator:
    handler: src/index.storyGeneratorHandler
    description: Genkit-powered story generator using AWS Bedrock
    events:
      - httpApi:
          path: /generate
          method: post
      - httpApi:
          path: /generate
          method: options

  jokeGenerator:
    handler: src/index.jokeHandler
    description: Genkit-powered joke generator using AWS Bedrock
    events:
      - httpApi:
          path: /joke
          method: post
      - httpApi:
          path: /joke
          method: options

  jokeStream:
    handler: src/index.jokeStreamHandler
    description: Streaming joke generator using Lambda Function URL
    url:
      invokeMode: RESPONSE_STREAM
      cors: true

custom:
  serverless-offline:
    httpPort: 3000
    host: 0.0.0.0
    noAuth: true
    useDocker: false
